plugins {
    id 'java'
    id 'application'
}

group = 'rs.raf.kids'
version = '1.0'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
    compileOnly 'org.projectlombok:lombok:1.18.38'
    annotationProcessor 'org.projectlombok:lombok:1.18.38'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

application {
    // Starts every servent of a scenario: ./gradlew run --args=ab_snapshot
    mainClass = 'app.MultipleServentStarter'
}

run {
    // Lets the "stop" command reach the starter.
    standardInput = System.in
}
